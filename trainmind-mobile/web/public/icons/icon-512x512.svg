<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <style>
      .teal-bg { fill: #0D3B3B; }
      .teal-accent { fill: #14B8A6; }
      .white-text { fill: #FFFFFF; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 220px; font-weight: bold; }
    </style>
  </defs>

  <!-- Background circle -->
  <circle cx="256" cy="256" r="256" class="teal-bg"/>

  <!-- Accent circle -->
  <circle cx="256" cy="256" r="230" class="teal-accent" opacity="0.2"/>

  <!-- Text "TM" -->
  <text x="256" y="340" class="white-text" text-anchor="middle" dominant-baseline="middle">TM</text>
</svg>
