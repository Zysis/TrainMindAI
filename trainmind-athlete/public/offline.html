<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TrainMind — Offline</title>
  <style>
    body { font-family: Inter, system-ui, sans-serif; background: #F8FAFC; color: #334155; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 1rem; text-align: center; }
    .box { max-width: 320px; }
    .icon { font-size: 3rem; margin-bottom: 1rem; }
    h1 { font-size: 1.25rem; margin: 0 0 0.5rem; }
    p { font-size: 0.875rem; color: #64748B; margin: 0 0 1.5rem; }
    button { background: #0D9488; color: white; border: none; padding: 0.75rem 1.5rem; border-radius: 0.75rem; font-size: 0.875rem; font-weight: 600; cursor: pointer; }
    button:hover { background: #0F766E; }
  </style>
</head>
<body>
  <div class="box">
    <div class="icon">📶</div>
    <h1>Sei offline</h1>
    <p>Controlla la connessione internet e riprova. Il form wellness salvato verrà inviato quando torni online.</p>
    <button onclick="location.reload()">Riprova</button>
  </div>
</body>
</html>
